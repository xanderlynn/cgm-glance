<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Badge gallery</title>
  <style>
    body { margin: 0; font: 12px system-ui, sans-serif; }
    .wall { padding: 12px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
    .dark { background: linear-gradient(135deg, #3b5f7e, #1a2a3a); color: #fff; }
    .light { background: #f2f2f2; }
    figure { margin: 0; display: flex; flex-direction: column; gap: 4px; }
    iframe { border: 0; background: transparent; color-scheme: normal; }
  </style>
</head>
<body>
  <div class="wall dark" id="dark"></div>
  <div class="wall light" id="light"></div>
  <script>
    // Same sizes as ui.rs badge_logical_size. Combined window, all people.
    const size = (style, sz, n) => {
      const k = { s: 0.8, m: 1, l: 1.3 }[sz];
      const [w, h] = { dot: [44, 44], number: [68, 68], arrow: [108, 68], age: [190, 48], card: [240, 120] }[style];
      return [Math.round(w * k) + 16, Math.round(Math.round(h * k) * n + 8 * (n - 1)) + 16];
    };
    const st = JSON.parse(localStorage.getItem("cgm-harness-state"));
    const n = st.people.length;
    const sizes = new URLSearchParams(location.search).get("sizes")?.split(",") ?? ["m"];
    for (const wall of ["dark", "light"])
      for (const style of ["dot", "number", "arrow", "age", "card"])
        for (const sz of sizes) {
          const [w, h] = size(style, sz, n);
          const f = document.createElement("figure");
          f.innerHTML = `<figcaption>${style} ${sz}</figcaption><iframe src="/ui/badge.html?label=badge-all&style=${style}&size=${sz}" style="width:${w}px;height:${h}px"></iframe>`;
          document.getElementById(wall).append(f);
        }
  </script>
</body>
</html>
