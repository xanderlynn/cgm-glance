<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="760" fill="#F4F6F8"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1B2430">3 · Add a person (setup wizard)</text>
  <text x="40" y="80" font-size="15" fill="#5A6573">Four short steps. Nothing is saved until the connection test shows the right person's reading.</text>

  <!-- Step 1 -->
  <g transform="translate(40,110)">
    <rect width="265" height="600" rx="12" fill="#fff" stroke="#DDE2E8"/>
    <text x="20" y="34" font-size="12" font-weight="700" fill="#4C6FFF" letter-spacing="1">STEP 1 OF 4</text>
    <text x="20" y="60" font-size="17" font-weight="700" fill="#1B2430">Where do readings</text>
    <text x="20" y="82" font-size="17" font-weight="700" fill="#1B2430">come from?</text>
    <g transform="translate(16,106)">
      <rect width="233" height="150" rx="10" fill="#EEF2FF" stroke="#4C6FFF" stroke-width="2"/>
      <circle cx="20" cy="24" r="8" fill="#fff" stroke="#4C6FFF" stroke-width="2"/><circle cx="20" cy="24" r="4" fill="#4C6FFF"/>
      <text x="36" y="29" font-size="14" font-weight="700" fill="#1B2430">Nightscout</text>
      <rect x="128" y="13" width="92" height="20" rx="10" fill="#2E9E5B"/><text x="174" y="27" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Recommended</text>
      <g font-size="12" fill="#3A4552">
        <text x="16" y="60">Uses a read-only token.</text>
        <text x="16" y="80">No Dexcom password needed.</text>
        <text x="16" y="100">You can revoke the token any</text>
        <text x="16" y="120">time from Nightscout.</text>
      </g>
    </g>
    <g transform="translate(16,270)">
      <rect width="233" height="170" rx="10" fill="#fff" stroke="#DDE2E8" stroke-width="1.5"/>
      <circle cx="20" cy="24" r="8" fill="#fff" stroke="#8A929C" stroke-width="2"/>
      <text x="36" y="29" font-size="14" font-weight="700" fill="#1B2430">Dexcom Share</text>
      <g font-size="12" fill="#3A4552">
        <text x="16" y="60">Uses the Dexcom login of the</text>
        <text x="16" y="80">person wearing the sensor</text>
        <text x="16" y="100">(not a follower account).</text>
        <text x="16" y="120">Share must be on with at</text>
        <text x="16" y="140">least one follower.</text>
      </g>
    </g>
    <text x="20" y="470" font-size="11.5" fill="#5A6573">Official Dexcom API is not offered:</text>
    <text x="20" y="487" font-size="11.5" fill="#5A6573">its data is 1–3 hours delayed.</text>
    <rect x="145" y="540" width="104" height="38" rx="8" fill="#4C6FFF"/><text x="197" y="564" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Next</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(325,110)">
    <rect width="265" height="600" rx="12" fill="#fff" stroke="#DDE2E8"/>
    <text x="20" y="34" font-size="12" font-weight="700" fill="#4C6FFF" letter-spacing="1">STEP 2 OF 4</text>
    <text x="20" y="60" font-size="17" font-weight="700" fill="#1B2430">Dexcom Share sign-in</text>
    <text x="20" y="96" font-size="12" font-weight="600" fill="#3A4552">Region</text>
    <rect x="20" y="104" width="225" height="34" rx="6" fill="#fff" stroke="#C9D0D8"/>
    <rect x="22" y="106" width="74" height="30" rx="5" fill="#4C6FFF"/><text x="59" y="126" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">US</text>
    <text x="133" y="126" font-size="12" fill="#3A4552" text-anchor="middle">Outside US</text>
    <text x="210" y="126" font-size="12" fill="#3A4552" text-anchor="middle">Japan</text>
    <text x="20" y="168" font-size="12" font-weight="600" fill="#3A4552">Email, username or phone</text>
    <rect x="20" y="176" width="225" height="36" rx="6" fill="#fff" stroke="#C9D0D8"/><text x="32" y="199" font-size="13" fill="#1B2430">alex@example.com</text>
    <text x="20" y="240" font-size="12" font-weight="600" fill="#3A4552">Password</text>
    <rect x="20" y="248" width="225" height="36" rx="6" fill="#fff" stroke="#4C6FFF" stroke-width="2"/><text x="32" y="272" font-size="15" fill="#1B2430" letter-spacing="2">••••••••••</text>
    <g transform="translate(20,306)">
      <rect width="225" height="150" rx="8" fill="#F2F7F4" stroke="#CFE6D7"/>
      <path d="M18 22 v-5 a7 7 0 0 1 14 0 v5" stroke="#2E9E5B" stroke-width="2.2" fill="none"/><rect x="14" y="22" width="22" height="16" rx="3" fill="#2E9E5B"/>
      <g font-size="12" fill="#24452F">
        <text x="46" y="26" font-weight="700">Stored in your OS</text>
        <text x="46" y="42" font-weight="700">keychain only</text>
        <text x="14" y="66">Windows Credential Manager,</text>
        <text x="14" y="84">macOS Keychain or Linux</text>
        <text x="14" y="102">Secret Service. Never written</text>
        <text x="14" y="120">to a file, log, or sent anywhere</text>
        <text x="14" y="138">except Dexcom.</text>
      </g>
    </g>
    <rect x="20" y="540" width="90" height="38" rx="8" fill="#fff" stroke="#C9D0D8"/><text x="65" y="564" font-size="14" fill="#3A4552" text-anchor="middle">Back</text>
    <rect x="120" y="540" width="129" height="38" rx="8" fill="#4C6FFF"/><text x="184" y="564" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Test connection</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(610,110)">
    <rect width="265" height="600" rx="12" fill="#fff" stroke="#DDE2E8"/>
    <text x="20" y="34" font-size="12" font-weight="700" fill="#4C6FFF" letter-spacing="1">STEP 3 OF 4</text>
    <text x="20" y="60" font-size="17" font-weight="700" fill="#1B2430">Check the reading</text>
    <circle cx="40" cy="104" r="14" fill="#2E9E5B"/><path d="M33 104 l5 5 l9 -10" stroke="#fff" stroke-width="2.6" fill="none"/>
    <text x="62" y="109" font-size="14" font-weight="600" fill="#1B2430">Connected to Dexcom (US)</text>
    <g transform="translate(20,138)">
      <rect width="225" height="150" rx="10" fill="#F7F9FB" stroke="#DDE2E8"/>
      <text x="16" y="28" font-size="12" fill="#5A6573">Latest reading</text>
      <text x="16" y="86" font-size="56" font-weight="800" fill="#2E9E5B">142</text>
      <text x="128" y="72" font-size="26" fill="#1B2430">→</text>
      <text x="128" y="92" font-size="12" fill="#5A6573">mg/dL</text>
      <text x="16" y="124" font-size="12" fill="#5A6573">Taken 2 minutes ago (9:39 AM)</text>
    </g>
    <text x="20" y="324" font-size="14" font-weight="600" fill="#1B2430">Does this match the</text>
    <text x="20" y="344" font-size="14" font-weight="600" fill="#1B2430">Dexcom app right now?</text>
    <g font-size="12" fill="#5A6573">
      <text x="20" y="376">If not, the wrong account or</text>
      <text x="20" y="394">region was used. Go back and</text>
      <text x="20" y="412">fix it before saving.</text>
    </g>
    <g transform="translate(20,440)">
      <rect width="225" height="60" rx="8" fill="#FFF6E5" stroke="#F2D59B"/>
      <text x="12" y="24" font-size="11.5" fill="#6B4A00">Wrong password? The app stops after</text>
      <text x="12" y="42" font-size="11.5" fill="#6B4A00">one failure to avoid locking the account.</text>
    </g>
    <rect x="20" y="540" width="90" height="38" rx="8" fill="#fff" stroke="#C9D0D8"/><text x="65" y="564" font-size="14" fill="#3A4552" text-anchor="middle">Back</text>
    <rect x="120" y="540" width="129" height="38" rx="8" fill="#4C6FFF"/><text x="184" y="564" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Yes, continue</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(895,110)">
    <rect width="265" height="600" rx="12" fill="#fff" stroke="#DDE2E8"/>
    <text x="20" y="34" font-size="12" font-weight="700" fill="#4C6FFF" letter-spacing="1">STEP 4 OF 4</text>
    <text x="20" y="60" font-size="17" font-weight="700" fill="#1B2430">How to show Alex</text>
    <text x="20" y="96" font-size="12" font-weight="600" fill="#3A4552">Name</text>
    <rect x="20" y="104" width="150" height="34" rx="6" fill="#fff" stroke="#C9D0D8"/><text x="32" y="126" font-size="13" fill="#1B2430">Alex</text>
    <text x="182" y="96" font-size="12" font-weight="600" fill="#3A4552">Initials</text>
    <rect x="182" y="104" width="63" height="34" rx="6" fill="#fff" stroke="#C9D0D8"/><text x="194" y="126" font-size="13" fill="#1B2430">AL</text>
    <text x="20" y="166" font-size="12" font-weight="600" fill="#3A4552">Color</text>
    <circle cx="34" cy="186" r="12" fill="#4C6FFF" stroke="#1B2430" stroke-width="2.5"/>
    <circle cx="66" cy="186" r="12" fill="#E0559B"/><circle cx="98" cy="186" r="12" fill="#14A3A3"/><circle cx="130" cy="186" r="12" fill="#9B59D0"/><circle cx="162" cy="186" r="12" fill="#E07A2E"/>
    <text x="20" y="230" font-size="12" font-weight="600" fill="#3A4552">Units</text>
    <rect x="20" y="238" width="225" height="32" rx="6" fill="#fff" stroke="#C9D0D8"/>
    <rect x="22" y="240" width="110" height="28" rx="5" fill="#4C6FFF"/><text x="77" y="259" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">mg/dL</text>
    <text x="189" y="259" font-size="12" fill="#3A4552" text-anchor="middle">mmol/L</text>
    <text x="20" y="302" font-size="12" font-weight="600" fill="#3A4552">Target range</text>
    <rect x="20" y="310" width="70" height="32" rx="6" fill="#fff" stroke="#C9D0D8"/><text x="55" y="331" font-size="13" fill="#1B2430" text-anchor="middle">70</text>
    <text x="104" y="331" font-size="13" fill="#5A6573">to</text>
    <rect x="126" y="310" width="70" height="32" rx="6" fill="#fff" stroke="#C9D0D8"/><text x="161" y="331" font-size="13" fill="#1B2430" text-anchor="middle">180</text>
    <text x="20" y="372" font-size="12" font-weight="600" fill="#3A4552">Urgent low below</text>
    <rect x="20" y="380" width="70" height="32" rx="6" fill="#fff" stroke="#C9D0D8"/><text x="55" y="401" font-size="13" fill="#1B2430" text-anchor="middle">55</text>
    <g transform="translate(20,438)">
      <rect width="36" height="20" rx="10" fill="#4C6FFF"/><circle cx="26" cy="10" r="7" fill="#fff"/>
      <text x="46" y="15" font-size="12.5" fill="#1B2430">Own icon in the tray</text>
      <g transform="translate(0,32)"><rect width="36" height="20" rx="10" fill="#C9D0D8"/><circle cx="10" cy="10" r="7" fill="#fff"/>
      <text x="46" y="15" font-size="12.5" fill="#1B2430">Notify on urgent low</text></g>
    </g>
    <rect x="20" y="540" width="90" height="38" rx="8" fill="#fff" stroke="#C9D0D8"/><text x="65" y="564" font-size="14" fill="#3A4552" text-anchor="middle">Back</text>
    <rect x="120" y="540" width="129" height="38" rx="8" fill="#2E9E5B"/><text x="184" y="564" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Save</text>
  </g>
</svg>
