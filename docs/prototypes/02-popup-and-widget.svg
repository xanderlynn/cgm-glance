<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="wall2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B5F7E"/><stop offset="0.6" stop-color="#22394F"/><stop offset="1" stop-color="#1A2A3A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1200" height="900" fill="#F4F6F8"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1B2430">2 · Tray popup and floating widget</text>
  <text x="40" y="80" font-size="15" fill="#5A6573">Left-click the tray icon for the popup. The widget is optional, stays on top, and can be dragged anywhere.</text>

  <rect x="40" y="100" width="1120" height="770" rx="12" fill="url(#wall2)"/>

  <!-- Popup -->
  <g transform="translate(720,150)" filter="url(#sh)">
    <rect width="400" height="640" rx="10" fill="#FBFBFC"/>
    <text x="22" y="38" font-size="17" font-weight="700" fill="#1B2430">CGM Glance</text>
    <text x="378" y="38" font-size="18" fill="#5A6573" text-anchor="end">⚙</text>
    <line x1="0" y1="56" x2="400" y2="56" stroke="#E4E7EB"/>

    <!-- person 1 -->
    <g transform="translate(16,70)">
      <rect width="368" height="160" rx="10" fill="#fff" stroke="#E4E7EB"/>
      <circle cx="28" cy="30" r="16" fill="#4C6FFF"/><text x="28" y="35" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">AL</text>
      <text x="54" y="28" font-size="15" font-weight="700" fill="#1B2430">Alex</text>
      <text x="54" y="46" font-size="12" fill="#5A6573">Dexcom Share · 2 min ago</text>
      <text x="352" y="44" font-size="40" font-weight="800" fill="#2E9E5B" text-anchor="end">142</text>
      <text x="352" y="62" font-size="12" fill="#5A6573" text-anchor="end">mg/dL  →  +2</text>
      <!-- sparkline 3h -->
      <rect x="14" y="76" width="340" height="70" rx="4" fill="#F2F7F4"/>
      <rect x="14" y="92" width="340" height="38" fill="#DCEFE3"/>
      <polyline fill="none" stroke="#2E9E5B" stroke-width="2.2" stroke-linejoin="round" points="14,124 40,126 66,122 92,118 118,112 144,104 170,98 196,94 222,96 248,100 274,104 300,106 326,105 350,104"/>
      <circle cx="350" cy="104" r="4" fill="#2E9E5B"/>
      <text x="18" y="141" font-size="10" fill="#5A6573">3 h</text><text x="350" y="141" font-size="10" fill="#5A6573" text-anchor="end">now</text>
      <text x="350" y="88" font-size="10" fill="#5A6573" text-anchor="end">target 70–180</text>
    </g>

    <!-- person 2 -->
    <g transform="translate(16,242)">
      <rect width="368" height="160" rx="10" fill="#fff" stroke="#E4E7EB"/>
      <circle cx="28" cy="30" r="16" fill="#E0559B"/><text x="28" y="35" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">MJ</text>
      <text x="54" y="28" font-size="15" font-weight="700" fill="#1B2430">Mia</text>
      <text x="54" y="46" font-size="12" fill="#5A6573">Nightscout · 4 min ago</text>
      <text x="352" y="44" font-size="40" font-weight="800" fill="#2E9E5B" text-anchor="end">88</text>
      <text x="352" y="62" font-size="12" fill="#5A6573" text-anchor="end">mg/dL  ↘  −6</text>
      <rect x="14" y="76" width="340" height="70" rx="4" fill="#F2F7F4"/>
      <rect x="14" y="92" width="340" height="38" fill="#DCEFE3"/>
      <polyline fill="none" stroke="#2E9E5B" stroke-width="2.2" stroke-linejoin="round" points="14,100 40,98 66,99 92,102 118,104 144,106 170,108 196,110 222,113 248,116 274,119 300,121 326,124 350,127"/>
      <circle cx="350" cy="127" r="4" fill="#E09A12"/>
      <text x="18" y="141" font-size="10" fill="#5A6573">3 h</text><text x="350" y="141" font-size="10" fill="#5A6573" text-anchor="end">now</text>
    </g>

    <!-- person 3 stale -->
    <g transform="translate(16,414)">
      <rect width="368" height="74" rx="10" fill="#F1F2F4" stroke="#E4E7EB"/>
      <circle cx="28" cy="30" r="16" fill="#8A929C"/><text x="28" y="35" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">SK</text>
      <text x="54" y="28" font-size="15" font-weight="700" fill="#1B2430">Sam</text>
      <text x="54" y="46" font-size="12" fill="#5A6573">No reading for 23 min</text>
      <text x="352" y="44" font-size="34" font-weight="800" fill="#8A929C" text-anchor="end">---</text>
      <text x="54" y="64" font-size="11" fill="#5A6573">Check the phone and Share settings.</text>
    </g>

    <line x1="0" y1="506" x2="400" y2="506" stroke="#E4E7EB"/>
    <g font-size="14" fill="#1B2430">
      <text x="22" y="536">＋ Add person</text>
      <text x="22" y="566">▣ Show desktop widget</text>
      <text x="22" y="596">Quit</text>
    </g>
    <text x="378" y="626" font-size="10.5" fill="#8A929C" text-anchor="end">Not a medical device. Keep Dexcom app alarms on.</text>
  </g>

  <!-- Widgets -->
  <text x="70" y="148" font-size="14" font-weight="700" fill="#fff">Widget · compact bar</text>
  <g transform="translate(70,162)" filter="url(#sh)">
    <rect width="330" height="52" rx="26" fill="#111821" fill-opacity="0.82"/>
    <circle cx="28" cy="26" r="7" fill="#2E9E5B"/>
    <text x="44" y="33" font-size="22" font-weight="800" fill="#fff">142</text>
    <text x="92" y="33" font-size="18" fill="#fff">→</text>
    <text x="114" y="32" font-size="12" fill="#A9B2BC">Alex</text>
    <line x1="160" y1="14" x2="160" y2="38" stroke="#3A4552"/>
    <circle cx="180" cy="26" r="7" fill="#2E9E5B"/>
    <text x="196" y="33" font-size="22" font-weight="800" fill="#fff">88</text>
    <text x="228" y="33" font-size="18" fill="#fff">↘</text>
    <text x="250" y="32" font-size="12" fill="#A9B2BC">Mia</text>
  </g>

  <text x="70" y="268" font-size="14" font-weight="700" fill="#fff">Widget · cards with 3 h trend</text>
  <g transform="translate(70,282)" filter="url(#sh)">
    <rect width="250" height="250" rx="14" fill="#111821" fill-opacity="0.86"/>
    <text x="18" y="32" font-size="13" fill="#A9B2BC">Alex · 2 min</text>
    <text x="18" y="76" font-size="44" font-weight="800" fill="#4CC47E">142</text>
    <text x="112" y="74" font-size="26" fill="#fff">→</text>
    <text x="232" y="74" font-size="12" fill="#A9B2BC" text-anchor="end">mg/dL</text>
    <polyline fill="none" stroke="#4CC47E" stroke-width="2" points="18,112 50,113 82,109 114,103 146,97 178,94 210,96 232,98"/>
    <line x1="18" y1="128" x2="232" y2="128" stroke="#2A3440"/>
    <text x="18" y="156" font-size="13" fill="#A9B2BC">Mia · 4 min</text>
    <text x="18" y="200" font-size="44" font-weight="800" fill="#4CC47E">88</text>
    <text x="86" y="198" font-size="26" fill="#fff">↘</text>
    <text x="232" y="198" font-size="12" fill="#A9B2BC" text-anchor="end">mg/dL</text>
    <polyline fill="none" stroke="#4CC47E" stroke-width="2" points="18,216 50,217 82,219 114,222 146,225 178,228 210,231 232,234"/>
  </g>

  <text x="360" y="268" font-size="14" font-weight="700" fill="#fff">Widget · single tile</text>
  <g transform="translate(360,282)" filter="url(#sh)">
    <rect width="130" height="130" rx="22" fill="#2E9E5B"/>
    <text x="65" y="78" font-size="48" font-weight="800" fill="#fff" text-anchor="middle">142</text>
    <text x="65" y="108" font-size="13" fill="#E6F6EC" text-anchor="middle">Alex → · 2m</text>
  </g>
  <g transform="translate(510,282)" filter="url(#sh)">
    <rect width="130" height="130" rx="22" fill="#8E1B1B"/>
    <rect x="4" y="4" width="122" height="122" rx="19" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="65" y="78" font-size="48" font-weight="800" fill="#fff" text-anchor="middle">52</text>
    <text x="65" y="108" font-size="13" fill="#FFE1E1" text-anchor="middle">Mia ⇊ · 1m</text>
  </g>

  <g transform="translate(70,580)">
    <rect width="570" height="250" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <text x="20" y="34" font-size="15" font-weight="700" fill="#fff">Widget behavior</text>
    <g font-size="13.5" fill="#D6DCE3">
      <text x="20" y="64">• Frameless, always on top, adjustable opacity, remembers position</text>
      <text x="20" y="90">• Right-click: switch layout, lock position, click-through, hide</text>
      <text x="20" y="116">• Works on Windows, macOS and Linux (one code path)</text>
      <text x="20" y="142">• Windows 11 Widgets Board version is a possible later phase</text>
      <text x="20" y="168">  (needs MSIX packaging and Adaptive Cards)</text>
      <text x="20" y="194">• Same stale rules as the tray: grey at 10 min, "---" at 20 min</text>
      <text x="20" y="220">• Hidden by default; turned on from the popup</text>
    </g>
  </g>
</svg>
