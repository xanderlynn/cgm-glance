<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CGM Glance</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body { border: 1px solid var(--line); border-radius: 10px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header, footer { padding: 12px 16px; display: flex; align-items: center; gap: 8px; }
    header { border-bottom: 1px solid var(--line); }
    header h1 { font-size: 15px; margin: 0; flex: 1; }
    main { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    footer { border-top: 1px solid var(--line); flex-wrap: wrap; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .card .value { font-size: 34px; line-height: 1; text-align: right; }
    .card .sub { text-align: right; }
    .spark .band { fill: color-mix(in srgb, var(--in_range) 14%, transparent); }
    .spark .line { fill: none; stroke: var(--c); stroke-width: 2; stroke-linejoin: round; }
    .spark .end { stroke: var(--c); stroke-width: 7; stroke-linecap: round; }
    .card > * { min-width: 0; }
    header h1, .card strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .alarm { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 600;
      background: color-mix(in srgb, var(--c) 16%, transparent); border: 1px solid var(--c); }
    .alarm.acked { font-weight: 400; background: none; border-style: dashed; }
    .card:has(.alarm:not(.acked)) { animation: pulse 1.2s steps(2, jump-none) infinite; }
    @keyframes pulse { 50% { border-color: var(--c); box-shadow: 0 0 0 2px var(--c); } }
    @media (prefers-reduced-motion: reduce) { .card { animation: none !important; } }
    .error { color: var(--low); }
    .quiet { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 16px; font-size: 12px; border-bottom: 1px solid var(--line); background: var(--accent-soft); }
    .msg { font-size: 12px; color: var(--muted); }
    .empty { text-align: center; padding: 28px 12px; color: var(--muted); }
    .disclaimer { width: 100%; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>CGM Glance</h1>
    <span id="demo" class="demo-pill" hidden>DEMO MODE</span>
    <button id="settings" title="Settings" aria-label="Settings">⚙</button>
  </header>
  <div id="quiet" class="quiet" hidden></div>
  <main id="list"></main>
  <footer>
    <button id="add">+ Add person</button>
    <button id="badge">Desktop badge</button>
    <span class="grow"></span>
    <button id="quit">Quit</button>
    <div class="disclaimer">Not a medical device. Keep Dexcom app alarms on.</div>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
