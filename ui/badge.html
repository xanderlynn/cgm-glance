<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CGM Glance badge</title>
  <link rel="stylesheet" href="common.css">
  <style>
    html, body { background: transparent !important; overflow: hidden; height: 100%; }
    #root { padding: 8px; display: flex; flex-direction: column; gap: 8px; height: 100%; user-select: none; -webkit-user-select: none; }
    #root.drag { cursor: grab; }
    /* Children ignore the mouse so drags start on #root, the drag region. */
    #root > * { pointer-events: none; }
    /* Fixed palette: badges sit on any wallpaper, so they don't follow the light/dark theme. */
    .b.st-in_range { --fill: #2e9e5b; --text: #4cc47e; }
    .b.st-high { --fill: #b8740a; --text: #f0b13a; }
    .b.st-low { --fill: #cc3b3b; --text: #ff7a7a; }
    .b.st-urgent_low { --fill: #8e1b1b; --text: #ff5c5c; }
    .b.st-stale { --fill: #737b85; --text: #a3acb6; }
    .b.st-no_data, .b.st-sign_in, .b.st-error, .b.st-loading { --fill: #545b64; --text: #a3acb6; }
    .b { --k: 1; position: relative; color: #fff; box-shadow: 0 3px 8px rgb(0 0 0 / .35); flex: none; }
    .b.demo { outline: 2px dashed var(--demo); outline-offset: -2px; }
    .b .n { font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
    .b .t { font-size: calc(11px * var(--k)); opacity: .9; }

    .dot { width: calc(44px * var(--k)); height: calc(44px * var(--k)); border-radius: 50%; background: var(--fill); display: grid; place-content: center; text-align: center; font-size: calc(20px * var(--k)); font-weight: 700; line-height: 1; }
    .dot .t { font-size: calc(10px * var(--k)); font-weight: 700; }
    .number, .arrow { height: calc(68px * var(--k)); border-radius: calc(14px * var(--k)); background: var(--fill); display: grid; place-content: center; text-align: center; gap: 3px; }
    .number { width: calc(68px * var(--k)); }
    .arrow { width: calc(108px * var(--k)); }
    .number .n { font-size: calc(26px * var(--k)); }
    .arrow .n { font-size: calc(28px * var(--k)); }
    .b.st-urgent_low { box-shadow: inset 0 0 0 3px #fff, 0 3px 8px rgb(0 0 0 / .35); }

    .age { width: calc(190px * var(--k)); height: calc(48px * var(--k)); border-radius: 999px; background: #111821; display: flex; align-items: center; gap: 8px; padding: 0 calc(16px * var(--k)); }
    .age .d { width: calc(12px * var(--k)); height: calc(12px * var(--k)); border-radius: 50%; background: var(--text); flex: none; }
    .age .n { font-size: calc(21px * var(--k)); white-space: nowrap; }
    .age .t { margin-left: auto; color: #a9b2bc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

    .card { width: calc(240px * var(--k)); height: calc(120px * var(--k)); border-radius: 14px; background: #111821; padding: calc(12px * var(--k)); display: flex; flex-direction: column; gap: 2px; }
    .card .n { font-size: calc(36px * var(--k)); color: var(--text); }
    .card .t { color: #a9b2bc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card .spark .band { fill: rgb(255 255 255 / .07); }
    .card .spark .line { fill: none; stroke: var(--text); stroke-width: 2; }
    .card .spark .end { stroke: var(--text); stroke-width: 6; stroke-linecap: round; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="badge.js"></script>
</body>
</html>
