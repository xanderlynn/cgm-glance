<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CGM Glance badge</title>
  <link rel="stylesheet" href="common.css">
  <style>
    html, body { background: transparent !important; overflow: hidden; height: 100%; }
    #root { padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; user-select: none; -webkit-user-select: none; }
    #root.drag { cursor: grab; }
    /* Children ignore the mouse so drags start on #root, the drag region. */
    #root > * { pointer-events: none; }
    /* Fixed palette: badges sit on any wallpaper, so they don't follow the light/dark theme. */
    .b.st-in_range { --fill: #2e9e5b; --text: #4cc47e; }
    .b.st-high { --fill: #b8740a; --text: #f0b13a; }
    .b.st-low { --fill: #cc3b3b; --text: #ff7a7a; }
    .b.st-urgent_low { --fill: #8e1b1b; --text: #ff5c5c; }
    .b.st-stale { --fill: #737b85; --text: #a3acb6; }
    .b.st-no_data, .b.st-sign_in, .b.st-error, .b.st-loading { --fill: #545b64; --text: #a3acb6; }
    .b { --k: 1; position: relative; color: #fff; flex: none; }
    .b.demo { outline: 2px dashed var(--demo); outline-offset: 1px; }
    .b .n { font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
    .b .t { font-size: calc(11px * var(--k)); line-height: 1; white-space: nowrap; }

    /* Pill: small dark capsule with a colored dot. */
    .pill { height: calc(34px * var(--k)); border-radius: 999px; background: #111821; display: flex; align-items: center; gap: calc(7px * var(--k)); padding: 0 calc(12px * var(--k)); box-shadow: 0 2px 6px rgb(0 0 0 / .35); }
    .pill .d { width: calc(9px * var(--k)); height: calc(9px * var(--k)); border-radius: 50%; background: var(--text); flex: none; }
    .pill .n { font-size: calc(16px * var(--k)); }
    .pill .t { color: #a9b2bc; }
    .pill.st-urgent_low { box-shadow: 0 0 0 2px var(--text), 0 2px 6px rgb(0 0 0 / .35); }

    /* Ring: number inside a colored circle outline. */
    .ring { width: calc(64px * var(--k)); height: calc(64px * var(--k)); border-radius: 50%; background: #111821; border: calc(3px * var(--k)) solid var(--text); display: grid; place-content: center; text-align: center; gap: 2px; box-shadow: 0 2px 6px rgb(0 0 0 / .35); }
    .ring .n { font-size: calc(20px * var(--k)); }
    .ring .t { color: var(--text); }
    .ring.st-urgent_low { border-width: calc(5px * var(--k)); }

    /* Faces: emoji only, most discreet. Hover shows the number. */
    .faces { width: calc(64px * var(--k)); height: calc(64px * var(--k)); display: grid; place-content: center; text-align: center; gap: 2px; }
    .faces .e { font-size: calc(38px * var(--k)); line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
    .faces .t { font-size: calc(12px * var(--k)); font-weight: 700; -webkit-text-stroke: 0.6px #000a; paint-order: stroke; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="badge.js"></script>
</body>
</html>
