name: Release

# Push a tag like v0.2.0 (matching the version in tauri.conf.json and Cargo.toml) to build
# signed installers for all three systems and attach them, with latest.json for in-app
# updates, to a draft GitHub Release. Needs the TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release build per tag at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The tag, tauri.conf.json and Cargo.toml must agree, or the updater would offer a
      # version that doesn't match what it installs.
      - name: Tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag=$TAG tauri.conf=$conf Cargo.toml=$cargo"
          [ "$TAG" = "v$conf" ] && [ "$conf" = "$cargo" ]

  build:
    needs: check
    # The signing key is an environment secret: only tag builds that a maintainer approves
    # can read it.
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: cargo install tauri-cli --version "=2.12.4" --locked
      # Builds the installers, signs the updater bundles and uploads them with latest.json
      # to a draft release. The app's updater ignores drafts, so publishing the release is
      # the manual step that ships an update.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The private signing key exists only as these two repository secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: cargo tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: CGM Glance ${{ github.ref_name }}
          releaseBody: See the commits since the last release. Not a medical device; keep the Dexcom app's alarms on.
          releaseDraft: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
